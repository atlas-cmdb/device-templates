comments: "1U single-socket rack server with one Intel Xeon 6 processor (E-cores or P-cores) and 16 DDR5 DIMM slots. Front bays support up to 16x EDSFF E3.S Gen5 NVMe, up to 10x 2.5-inch or 4x 3.5-inch drives. Available in rear I/O (hot aisle) and front I/O (cold aisle) configurations. Hot swap redundant M-CRPS power supplies from 800 W to 1500 W. The rear I/O configuration modelled here has PCIe slots 1 and 4 and one OCP NIC 3.0 slot. In the front I/O configuration the OCP NIC 3.0 slots are 31 and 32 on the front riser. BOSS-N1 DC-MHS is installed at the rear. Dimensions: 42.8 mm x 482 mm x 815.14 mm (rear I/O, without bezel). Weight is the maximum configuration (8x E3.S)."
