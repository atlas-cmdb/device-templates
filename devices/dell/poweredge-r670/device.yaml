comments: "1U dual-socket rack server with two Intel Xeon 6 processors (E-cores or P-cores) and 32 DDR5 DIMM slots. Front bays support up to 20x EDSFF E3.S Gen5 NVMe or up to 10x 2.5-inch drives. Available in rear I/O (hot aisle) and front I/O (cold aisle) configurations. Hot swap redundant power supplies from 800 W to 1800 W. The rear I/O configuration modelled here has PCIe slots 1 and 4 and OCP NIC 3.0 slots 2 and 5. The front riser can carry PCIe slots 31 and 32. BOSS-N1 occupies slot 34 (front) or slot 3 (rear). Dimensions: 42.8 mm x 482 mm x 815.14 mm (rear I/O, without bezel)."
