comments: |-
  The DM1005E switch line is a wire-speed Gigabit Ethernet solution designed to meet the growing bandwidth demands of corporate network applications. It includes models with and without PoE+, and with 1GE or 10GE optical uplink interfaces.
  The switches offer switching capacities ranging from 56 Gbit/s to 216 Gbit/s, with all packet processing implemented in hardware at wire-speed, ensuring non-blocking switching for all packets.
  Features such as filters and IP routing are also executed in hardware, with no impact on CPU performance or packet forwarding.
