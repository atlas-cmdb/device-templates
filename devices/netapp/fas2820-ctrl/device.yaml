comments: |-
  Onboard ports per controller: e0a/e0b 25GbE SFP28 (cluster/HA interconnect), wrench port e0M (shared with
  the BMC), external SAS ports 0a and 0b1. SAS port 0b2 is not used by ONTAP and is always disabled, so it is
  not modelled. Mezzanine slot 1 takes a 4-port card (ports e1a-e1d or 1a-1d).
