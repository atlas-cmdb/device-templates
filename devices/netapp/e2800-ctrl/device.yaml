comments: |-
  Controller canister for the E2812 and E2824 controller shelves. Fixed ports per controller: management ports
  P1 and P2 (1Gb RJ-45; P2 is reserved for technical support), drive expansion ports EXP1 and EXP2 (12Gb/s SAS),
  an RJ-45 serial port and a micro USB serial port (both reserved for technical support). The USB port
  (technical support only) is not modelled. The two baseboard host ports 0a and 0b are either SFP+ (16Gb FC /
  10Gb iSCSI) or RJ-45 (10Gb iSCSI) depending on the controller ordered, so they are not modelled; add them on
  the device. The optional host interface card (HIC, ports 0c onwards) goes in the HIC bay.
  Connectors:
  Management port P1:
  Host ports and HIC:
