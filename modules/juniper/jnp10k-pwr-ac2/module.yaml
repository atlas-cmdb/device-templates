  ## JNP10K-PWR-AC2 Power Supply
  The JNP10K-PWR-AC2 power supply is a high-capacity model that is designed to support AC, high-voltage AC (HVAC), or high-voltage DC (HVDC) systems in either a 20-A or a 30-A mode; see . The power supply feeds AC input and provides DC output of 5000 W with a single feed and 5500 W with a dual feed. The operating input voltage range is 180 to 305 VAC for AC systems and 190 to 410 VDC for DC systems.
