name: "🐞 Bug report"
description: Broken tooling, validation failing on correct data, a bad image, or a problem with the published manifest/URLs.
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command, URL or template id.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit / dataset version
      description: "`commit` from https://atlas-cmdb.github.io/device-templates/version.json, or your git SHA."
